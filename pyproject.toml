[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archive2md"
version = "0.2.0"
description = "Extract any archive/folder -> Convert docs -> OCR vision -> Markdown (Native Python + NVIDIA CUDA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown>=0.1.9",
    "pdfminer-six>=20231228",
    "mammoth>=1.6.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "olefile>=0.47",
    "xlrd>=2.0.1",
    "lxml>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.6",
    "py7zr>=0.20.0",
    "rarfile>=4.1",
    "pillow>=10.0.0",
    "llama-cpp-python>=0.3.36",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-nvrtc-cu12>=12.9.86",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-genai>=3.0.0",
]

[project.scripts]
archive2md = "cli:main"
